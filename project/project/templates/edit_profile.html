{% extends "base.html" %}
{% load static %}

{% block title %}AskPupkin - Edit Profile{% endblock %}

{% block content %}
<div class="container mt-5">
    <h3>Edit Profile</h3>
    
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="form-group row">
            <label for="username" class="col-sm-2 col-form-label">Username</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="username" value="{{ user.username }}" disabled>
            </div>
        </div>
        
        <div class="form-group row">
            <label for="email" class="col-sm-2 col-form-label">Email</label>
            <div class="col-sm-10">
                <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}">
            </div>
        </div>
        
        <div class="form-group row">
            <label for="nickname" class="col-sm-2 col-form-label">Nickname</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="nickname" name="bio" value="{{ profile.bio|default:"" }}">
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-2 col-form-label">Avatar</label>
            <div class="col-sm-10">
                {% if profile.avatar %}
                    <img src="{{ profile.avatar.url }}" alt="Avatar" width="100" class="mb-2">
                {% else %}
                    <div class="avatar-placeholder mb-2">No avatar set</div>
                {% endif %}
                <input type="file" class="form-control-file" name="avatar">
            </div>
        </div>
        
        <div class="form-group row">
            <div class="col-sm-10 offset-sm-2">
                <button type="submit" class="btn btn-success">Save Changes</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
