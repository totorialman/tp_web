<div class="mb-4 mt-2">
    <h5>Popular Tags</h5>
    <p class="custom-links">
        {% for tag in popular_tags %}
            <a href="{% url 'tag_detail' tag.name %}" class="badge 
                {% if forloop.counter == 1 %} bg-primary
                {% elif forloop.counter == 2 %} bg-success
                {% elif forloop.counter == 3 %} bg-danger
                {% elif forloop.counter == 4 %} bg-warning
                {% elif forloop.counter == 5 %} bg-info
                {% elif forloop.counter == 6 %} bg-dark
                {% else %} bg-secondary {% endif %}">
                {{ tag.name }}
            </a> 
        {% endfor %}
    </p>
</div>

<div>
    <h5>Best Members</h5>
    <ul class="list-unstyled">
        {% for user in best_users %}
            <li>{{ user.username }}</li>
        {% endfor %}
    </ul>
</div>
